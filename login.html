
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Login | Timidy Store</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172033;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 38px 30px;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .08);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 8px;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
      margin: 0;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px;
      margin-bottom: 20px;
    }

    input:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 1px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #172033;
      color: white;
      border: 0;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #293b59;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      min-height: 20px;
      font-size: 13px;
      margin-top: 16px;
      text-align: center;
      color: #dc2626;
    }

    .footer {
      text-align: center;
      margin-top: 26px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <main class="login-card">

    <div class="brand">
      <img
        src="images/company-logo.png"
        alt="Timidy Store logo"
        width="72"
        height="72"
      >

      <h1>Timidy Store</h1>

      <p class="subtitle">
        Administrator Sign In
      </p>
    </div>

    <form id="loginForm">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        autocomplete="username"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        autocomplete="current-password"
        required
      >

      <button
        type="submit"
        id="loginButton"
      >
        Sign In
      </button>

      <p
        class="message"
        id="loginMessage"
        role="alert"
        aria-live="polite"
      ></p>

    </form>

    <div class="footer">
      Authorized Administrator Access Only
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    "use strict";

    // =====================================
    // TIMIDY STORE — ADMIN LOGIN
    // =====================================

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const loginMessage =
      document.getElementById("loginMessage");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    let loginBusy = false;
    let redirecting = false;

    // =====================================
    // UI HELPERS
    // =====================================

    function setLoginBusy(value) {
      loginBusy = value;

      loginButton.disabled = value;

      loginButton.textContent = value
        ? "Signing in..."
        : "Sign In";
    }

    function showLoginError(text) {
      loginMessage.textContent = text;
    }

    function goToDashboard() {
      if (redirecting) return;

      redirecting = true;

      window.location.replace(
        "index.html"
      );
    }

    // =====================================
    // EXISTING SESSION
    // =====================================

    async function checkExistingSession() {
      try {
        const user =
          await window.TimidyAuth
            .getAuthorizedUser();

        if (user) {
          goToDashboard();
        }
      } catch (error) {
        // An existing session could not
        // be verified. Keep the login
        // form available for a fresh sign-in.
        console.error(
          "Session verification failed:",
          error
        );
      }
    }

    // =====================================
    // SIGN IN
    // =====================================

    async function handleLogin(event) {
      event.preventDefault();

      if (loginBusy || redirecting) {
        return;
      }

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      if (!email || !password) {
        showLoginError(
          "Enter your email and password."
        );

        return;
      }

      setLoginBusy(true);
      showLoginError("");

      try {
        await window.TimidyAuth.login(
          email,
          password
        );

        goToDashboard();
      } catch (error) {
        console.error(
          "Administrator sign-in failed:",
          error
        );

        // Avoid exposing internal
        // database or authorization
        // implementation details.
        showLoginError(
          "Unable to sign in. Check your " +
          "credentials and administrator access."
        );

        passwordInput.value = "";

        setLoginBusy(false);
      }
    }

    // =====================================
    // EVENTS
    // =====================================

    loginForm.addEventListener(
      "submit",
      handleLogin
    );

    // Start session check once.
    checkExistingSession();
  </script>

</body>
</html>

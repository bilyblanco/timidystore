<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Developer Login | Timidy Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at top,
          #1d365c,
          #0b1220 60%
        );
      color: #f8fafc;
      font-family: Inter, system-ui, Arial, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 34px;
      background: #17243a;
      border: 1px solid #334155;
      border-radius: 20px;
      box-shadow: 0 24px 70px #0006;
    }

    .eyebrow {
      color: #93c5fd;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0;
      font-size: 27px;
    }

    .description {
      color: #aebed2;
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #475569;
      border-radius: 10px;
      background: #0f1b2e;
      color: white;
      font: inherit;
    }

    input:focus {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      min-height: 22px;
      margin: 16px 0 0;
      font-size: 13px;
      line-height: 1.5;
      color: #fca5a5;
    }

    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #93c5fd;
      font-size: 13px;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="eyebrow">
      Timidy Store · Technical Access
    </div>

    <h1>Developer Login</h1>

    <p class="description">
      Sign in with your dedicated maintenance
      credentials. Business records are not
      accessible through this account.
    </p>

    <form id="maintenanceLoginForm">
      <label for="email">Email address</label>

      <input
        id="email"
        type="email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        Sign In to Maintenance
      </button>

      <p
        id="loginMessage"
        class="message"
        role="alert"
        aria-live="polite"
      ></p>
    </form>

    <a class="back" href="login.html">
      Return to administrator login
    </a>
  </main>

  <script>
    "use strict";

    const db = window.timidySupabase;

    const form = document.getElementById(
      "maintenanceLoginForm"
    );

    const button = document.getElementById(
      "loginButton"
    );

    const message = document.getElementById(
      "loginMessage"
    );

    if (!db) {
      message.textContent =
        "Supabase configuration is missing.";
      button.disabled = true;
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!db || button.disabled) return;

      button.disabled = true;
      message.textContent = "";

      try {
        const email = document.getElementById(
          "email"
        ).value.trim();

        const password = document.getElementById(
          "password"
        ).value;

        const { error } =
          await db.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          throw error;
        }

        const { data, error: roleError } =
          await db.rpc("is_store_maintainer");

        if (roleError) {
          throw roleError;
        }

        if (data !== true) {
          await db.auth.signOut();

          throw new Error(
            "This account is not authorized for maintenance."
          );
        }

        window.location.replace(
          "maintenance.html"
        );
      } catch (error) {
        message.textContent =
          error.message ||
          "Unable to sign in.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
